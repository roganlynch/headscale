stages:
  - dispatch
  - build
  - package
  - verify
  - publish

# dispatch job (upstream-tag pickup + self-prune) lives here now, shared with
# internal/chrony_exporter and internal/nebula-sync -- see that file's header
# for why, and internal/headscale ci-config commit dea76b6b (or earlier) for
# the last hand-copied version if you need pre-centralization history.
include:
  - project: 'internal/debian-baseline'
    ref: main
    file: 'ci-templates/dispatch.yml'

# Default "1" (live) so every normal path -- a real `git push --tags`, and the
# dispatch job's `POST .../pipeline?ref=${tag}` -- keeps publishing exactly as
# before without anyone having to think about this. Tag pushes themselves
# can't carry variable overrides, so the only way to get PUBLISH_LIVE=0 is a
# manual "Run pipeline" (UI or API) against an *existing* tag ref with the
# variable set explicitly -- that's also why this can't default to "0": there
# would be no push-triggered path left that ever actually publishes.
variables:
  PUBLISH_LIVE: "1"

# Plain `go build` matching the Makefile's own ldflags (`-X main.version=...`)
# rather than pulling in goreleaser -- this pipeline only needs one
# linux/amd64 binary for the deb, not goreleaser's full cross-platform
# archive/docker/ko matrix.
#
# Two tag formats both build here:
#   v1.2.3             -- upstream release, tagged on `main` (pushed manually,
#                         see the dispatch comment above)
#   internal-v1.2.3-N  -- our own patched build, tagged on `internal` and
#                         pushed directly by us, so it gets a normal
#                         push-triggered pipeline -- no dispatch workaround
#                         needed, that's only for tags synced in from upstream
build:
  stage: build
  image: golang:1.26
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v|internal-v)/'
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
  # Keyed on go.sum's content hash rather than the ref, so a cache built for
  # v1.2.3 is reused by internal-v1.2.3-N patch tags (same dependency graph)
  # and by the next release that doesn't touch go.sum -- only a go.sum change
  # invalidates it. GitLab hashes the listed file itself for the key, so this
  # stays correct without us maintaining a version string by hand.
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/
  script:
    - mkdir -p .build
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath
        -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}"
        -o .build/headscale ./cmd/headscale
  artifacts:
    paths:
      - .build/headscale
    expire_in: 1 hour

# Tag checkouts are the pristine upstream mirror (or, for internal-v tags,
# whatever's on `internal` at that point) -- nfpm.yaml only exists on
# ci-config, so pull just that in without touching the rest. Unlike
# nebula-sync, the packaging/ assets themselves (systemd unit, deb
# maintainer scripts) already ship in the headscale tree on every tag, so
# there's nothing else to pull in here.
package:
  stage: package
  image: golang:1.26
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v|internal-v)/'
  variables:
    NFPM_VERSION: "2.39.0"
  cache:
    key: "nfpm-${NFPM_VERSION}"
    paths:
      - .nfpm-cache/
  before_script:
    - |
      mkdir -p .nfpm-cache
      if [ ! -x .nfpm-cache/nfpm ]; then
        echo "nfpm ${NFPM_VERSION} not cached, downloading"
        curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C .nfpm-cache nfpm
      else
        echo "using cached nfpm ${NFPM_VERSION}"
      fi
    - export PATH="${PWD}/.nfpm-cache:${PATH}"
    - git fetch origin ci-config
    - git checkout origin/ci-config -- nfpm.yaml
  script:
    - |
      set -eu
      case "$CI_COMMIT_TAG" in
        internal-v*)
          export PKG_NAME=headscale-internal
          export PKG_CONFLICTS=headscale
          export PKG_VERSION="${CI_COMMIT_TAG#internal-v}"
          ;;
        v*)
          export PKG_NAME=headscale
          export PKG_CONFLICTS=headscale-internal
          export PKG_VERSION="${CI_COMMIT_TAG#v}"
          ;;
        *)
          echo "Unrecognized tag format: ${CI_COMMIT_TAG}" >&2
          exit 1
          ;;
      esac
      nfpm package --config nfpm.yaml --packager deb --target "${PKG_NAME}_${PKG_VERSION}_amd64.deb"
  artifacts:
    paths:
      - "headscale*_amd64.deb"

# Runs the just-built .deb under real systemd in a nested, privileged
# container (needs the runner host's Docker socket mounted into job
# containers -- see /etc/gitlab-runner/config.toml on gitlab.internal.lan).
#
# This does NOT prove a real tailnet comes up -- that needs real config
# (server_url, DERP, a listener) and is covered by the integration test
# suite instead. This proves the half that's actually package-specific:
# the deb installs, the system user/group and unit are created correctly,
# the service starts and stays active as User=headscale, the shipped
# config lands at /etc/headscale/config.yaml, and removal leaves that
# config in place (config|noreplace).
verify:
  stage: verify
  image: docker:27-cli
  needs: ["package"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v|internal-v)/'
  variables:
    TEST_IMAGE: "headscale-citest-base:v1"
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - git fetch origin ci-config
    - git checkout origin/ci-config -- packaging/ci
  script:
    - |
      set -eu
      if ! docker image inspect "$TEST_IMAGE" >/dev/null 2>&1; then
        docker build --tag "$TEST_IMAGE" -f packaging/ci/Dockerfile.systemd-test packaging/ci/
      fi

      CONTAINER="headscale-verify-${CI_JOB_ID}"
      cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
      trap cleanup EXIT

      docker run -d --name "$CONTAINER" --privileged --cgroupns=host \
        -e container=docker \
        --tmpfs /run --tmpfs /run/lock \
        "$TEST_IMAGE"

      DEB=$(ls headscale*_amd64.deb)
      PKG_NAME=$(basename "$DEB" | sed -E 's/_[^_]+_amd64\.deb$//')

      # Only waiting for the system bus to come up, not for is-system-running
      # to reach "running" -- this minimal container reports "degraded" (some
      # default unit failing, unrelated to anything under test) and never
      # clears it, same as it would on any other bare debian:trixie base.
      for i in $(seq 1 60); do
        STATE=$(docker exec "$CONTAINER" systemctl is-system-running 2>&1) || true
        case "$STATE" in
          *"Failed to connect"*) echo "waiting for systemd bus ($i/60): $STATE"; sleep 1; continue ;;
        esac
        echo "systemd bus ready: $STATE"
        break
      done

      docker cp "$DEB" "$CONTAINER:/root/$DEB"
      docker exec "$CONTAINER" dpkg -i "/root/$DEB"

      docker exec -e PKG_NAME="$PKG_NAME" "$CONTAINER" bash -eu -c '
        check() { echo "-- check: $1"; }

        check "headscale system user was created"
        getent passwd headscale

        check "package-shipped config was installed"
        [ -f /etc/headscale/config.yaml ]

        systemctl daemon-reload
        systemctl enable --now headscale.service
        sleep 2
        systemctl status headscale.service --no-pager || true

        check "User=headscale"
        ACTUAL_USER=$(systemctl show headscale.service -p User --value)
        echo "got: [$ACTUAL_USER]"
        [ "$ACTUAL_USER" = "headscale" ]

        check "unit reaches active"
        ACTIVE_STATE=unknown
        for i in $(seq 1 20); do
          ACTIVE_STATE=$(systemctl show headscale.service -p ActiveState --value)
          [ "$ACTIVE_STATE" = "active" ] && break
          echo "waiting for active ($i/20): $ACTIVE_STATE"
          sleep 1
        done
        echo "got ActiveState=[$ACTIVE_STATE]"
        [ "$ACTIVE_STATE" = "active" ]

        check "binary runs"
        headscale version

        check "remove leaves shipped config in place (config|noreplace)"
        dpkg -r "$PKG_NAME"
        [ -f /etc/headscale/config.yaml ]

        echo "verify: all checks passed"
      '

# Publishes into the SAME shared repo.internal.lan / pkgs.internal.lan apt
# pool that nebula-sync and chrony-exporter use, but -- like every other
# publisher on this host -- via its own dedicated headscale-deploy system
# account and key, a member of the shared local-repo-publishers group that
# owns pool/main/. There is no actual shared deploy account: each package
# gets its own <pkg>-deploy user, home, forced-command wrapper script, and
# key; only the destination pool/index is shared.
publish:
  stage: publish
  image: alpine:3.20
  needs: ["package", "verify"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v|internal-v)/'
  before_script:
    - apk add --no-cache curl jq openssh-client
  script:
    - |
      set -eu
      if [ "${PUBLISH_LIVE}" != "1" ]; then
        echo "PUBLISH_LIVE=${PUBLISH_LIVE}: dry run, not touching pkgs.internal.lan."
        echo "Purging this pipeline's package artifact instead of publishing it."
        PKG_JOB_ID=$(curl -sf --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?per_page=100" \
          | jq -r '.[] | select(.name == "package") | .id')
        if [ -n "${PKG_JOB_ID}" ]; then
          curl -sf --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${PKG_JOB_ID}/artifacts"
          echo "purged package job (${PKG_JOB_ID}) artifacts"
        else
          echo "WARNING: could not find the package job's id, nothing purged" >&2
        fi
        exit 0
      fi

      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      # DEPLOY_SSH_PRIVATE_KEY is a GitLab file-type variable: the env var holds
      # a path to the key, not the key content -- copy it, don't echo it
      cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -t ed25519 -H pkgs.internal.lan >> ~/.ssh/known_hosts

      DEB=$(ls headscale*_amd64.deb)
      # -O: force legacy scp protocol -- OpenSSH 9.0+ clients default to SFTP
      # under the hood, which the forced-command wrapper on the deploy account
      # (matching literal `scp -t <path>`) doesn't recognize without it.
      scp -O -i ~/.ssh/id_ed25519 "$DEB" headscale-deploy@pkgs.internal.lan:pool/main/
      ssh -i ~/.ssh/id_ed25519 headscale-deploy@pkgs.internal.lan reindex
